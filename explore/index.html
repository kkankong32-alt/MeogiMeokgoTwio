<body>
  <button id="fullscreen-toggle" aria-label="전체화면으로 보기" title="전체화면으로 보기">⛶</button>
  <div id="app">
    <section id="entry" aria-label="먹이 먹고 튀어 시작 화면">
      <div class="entry-art" id="entry-art">
        <img id="title-image" src="assets/title/role-menu-v0141.png" width="1672" height="941" alt="먹이 먹고 튀어. 살아볼 생물을 골라요. 왼쪽부터 메뚜기, 개구리, 뱀, 매. 아래 조작방법, 시작하기, 게임설명." fetchpriority="high">
        <h1 class="entry-fallback">먹이 먹고 튀어</h1>
        <button id="choose-hopper" class="role-hotspot" aria-pressed="true" aria-label="메뚜기로 살아보기"><span class="sr-only">메뚜기로 살아보기</span></button>
        <button id="choose-frog" class="role-hotspot" aria-pressed="false" aria-label="개구리로 살아보기"><span class="sr-only">개구리로 살아보기</span></button>
        <button id="choose-snake" class="role-hotspot" aria-pressed="false" aria-label="뱀으로 살아보기"><span class="sr-only">뱀으로 살아보기</span></button>
        <button id="choose-hawk" class="role-hotspot" aria-pressed="false" aria-label="매로 살아보기"><span class="sr-only">매로 살아보기</span></button>
        <button id="start" class="start-button"><span class="sr-only">시작하기</span></button>
        <button id="entry-controls" class="menu-hotspot" aria-label="조작방법 보기"><span class="sr-only">조작방법</span></button>
        <button id="entry-story" class="menu-hotspot" aria-label="게임설명 보기"><span class="sr-only">게임설명</span></button>
      </div>
      <p class="creator-credit">기획·제작: 쓰로인훈쌤 김종훈</p>
      <p id="chapter-hint" class="sr-only">이번엔 내가 먹이! 풀을 뜯고 개구리의 혀를 피해요.</p>
      <p id="asset-status" class="sr-only" role="status">그림 준비 중</p><button id="retry-assets" hidden>그림 다시 불러오기</button>
    </section>
    <div id="game" hidden>
      <header><div><span class="tag" id="role-tag">메뚜기로 살아보기 · 0.16.6</span><h1>먹이 먹고 튀어</h1></div><nav aria-label="게임 안내"><button id="help" class="image-menu menu-controls" aria-label="조작 안내와 설정 열기"><span class="sr-only">조작방법</span></button><button id="game-story" class="image-menu menu-story" aria-label="게임설명 보기"><span class="sr-only">게임설명</span></button><button id="settings-open">설정</button></nav></header>
      <main>
        <section class="stage" aria-label="연못 탐험 플레이 영역">
          <div class="stage-top">
            <div class="hud" role="group" aria-label="플레이 상태"><span id="timer">90초</span><span id="food">먹이 기록 0</span><span id="remaining-food">남은 먹이</span><span id="state">준비</span></div>
            <div class="top-actions"><button id="pause">일시정지</button><button id="records" hidden>탐험 수첩</button><button id="learning-open">탐험 여정</button><button id="change-role" hidden>역할 바꾸기</button><button id="home" aria-label="처음 화면으로">⌂ 홈</button><button id="sound-toggle" aria-pressed="false" aria-label="효과음 켜기">소리 꺼짐</button><button id="compact-help" aria-label="조작 안내와 설정 열기">조작방법</button><button id="compact-settings">설정</button></div>
          </div>
          <div class="playfield" id="playfield">
            <canvas id="world" tabindex="0" aria-label="개구리 연습 영역. 방향키 또는 WASD로 이동, J로 먹기, K로 짧은 뜀, 스페이스로 큰 도약" aria-describedby="keyboard-instructions"></canvas>
            <div id="pause-overlay" hidden><p id="pause-reason">일시정지</p><div class="pause-actions"><button id="resume">계속하기</button><button id="restart">다시 시작</button></div></div>
          </div>
          <div class="controls" id="touch-controls" aria-label="화면 조작">
            <div class="pad-wrap"><div id="pad" role="group" aria-label="이동 조이스틱. 누른 채 원하는 방향으로 움직이세요"><span id="stick"></span><i>이동</i></div></div>
            <p class="control-hint" id="control-hint">왼손 이동<br>오른손 먹기·짧은 뜀·큰 도약</p>
            <div class="actions"><button id="eat">먹기 <small>J</small></button><button id="hop">짧은 뜀 <small>K</small></button><button id="jump">큰 도약 <small>SPACE</small></button></div>
          </div>
          <div class="stage-footer"><span id="movement-caption">즉시 이동 · 빠른 먹기 · 방향 도약</span><span id="status"></span><span id="orientation-tip">가로 화면에서 주변을 더 넓게 볼 수 있어요</span></div>
        </section>
        <p class="sr-only" id="keyboard-instructions">방향키 또는 WASD로 이동, J 먹기, K 짧은 뜀, SPACE 큰 도약. 터치: 왼쪽 이동 패드와 오른쪽 행동 버튼을 함께 누를 수 있어요.</p>
      </main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-body"><h2 id="dialog-title" tabindex="-1" autofocus>조작과 설정</h2><div id="help-guide" hidden><div id="poster-scroll" tabindex="0" aria-label="안내 이미지. 크게 보기 후 좌우와 위아래로 이동해 읽을 수 있어요">
      <img id="controls-poster" src="assets/ui/controls-full-v091.png" width="1672" height="941" alt="조작방법. 컴퓨터: 방향키 또는 WASD 이동, J 먹기, K 짧은 뜀, SPACE 큰 도약. 태블릿과 휴대폰: 왼손으로 동그라미를 밀어 이동하고 오른손으로 먹기, 짧은 뜀, 큰 도약 버튼을 누르세요. 이동과 행동을 함께 누를 수 있습니다. 밝은 원에 먹이를 맞추고 움직이는 방향으로 도약하세요.">
      <img id="story-poster" src="assets/ui/story-full-v092.png" width="1672" height="941" hidden alt="개구리로 살아보기. 먹이를 잡고 뱀을 피하며 90초! 메뚜기를 향해 다가가 먹고, 뱀의 점선 경고를 보면 옆으로 도약하세요. 끝나면 누가 누구를 먹었는지 확인합니다. 메뚜기에서 개구리로, 개구리에서 뱀으로 향하는 화살표는 먹히는 생물에서 먹는 생물로 향합니다. 90초가 지나거나 뱀에게 잡히면 한 판이 끝납니다. 먹이 개수는 과학 이해 점수가 아닙니다. 물과 바위는 지나갈 수 없습니다.">
      <img id="hopper-controls-poster" src="assets/ui/hopper-controls-v011.png" width="1672" height="941" hidden alt="메뚜기 조작방법. 방향키 또는 WASD 이동, J 먹기, K 짧은 뜀, SPACE 큰 도약. 터치: 왼손 이동 패드, 오른손 행동 버튼. 풀 가까이에서 멈추고 먹기. 움직이거나 뛰면 먹기를 멈춰요. 점선 옆으로 피하고 향한 방향으로 도약해요.">
      <img id="hopper-story-poster" src="assets/ui/hopper-story-v011.png" width="1672" height="941" hidden alt="메뚜기로 살아보기. 풀을 뜯고 개구리를 피하며 90초. 풀밭마다 세 번 먹고 다른 곳으로 이동해요. 점선 경고를 보면 옆으로 도약해요. 탐험 수첩에서 풀을 관찰하고 관계를 연결해요. 풀에서 메뚜기, 메뚜기에서 개구리로 향하는 화살표. 먹히는 생물에서 먹는 생물로. 90초가 지나거나 잡히면 종료. 먹이 개수는 과학 이해 점수가 아니에요.">
      <img id="hawk-poster" hidden src="assets/ui/hawk-guide-v014.png" width="1672" height="941" alt="매로 살아보기. 지면 원을 먹이에 맞춰 급강하하세요. 방향키 또는 WASD 비행, J 급강하, K 취소, SPACE 빠른 비행. 터치: 왼손 이동 패드, 오른손 급강하·취소·빠른 비행. 개구리와 뱀을 잡으면 기록돼요. 최대90초 또는 먹이가 모두 사라지면 실제 먹이 관계를 살펴봐요. 이 게임에서 매를 쫓는 동물은 나오지 않아요. 먹이 개수는 과학 이해 점수가 아니에요.">
      <img id="snake-poster" hidden src="assets/ui/snake-guide-v013.png" width="1672" height="941" alt="뱀으로 살아보기. 개구리를 잡고 매를 피해 90초. 방향키 또는 WASD 이동, J 물기, K 짧게 이동, SPACE 빠르게 이동. 터치: 왼손 이동 패드와 오른손 행동 버튼. 매의 예고 원 밖으로 머리를 옮겨요. 뱀은 뛰지 않고 지면을 따라 움직여요.">
    </div></div><div id="dialog-content"></div>
    <fieldset id="settings"><legend>플레이 설정</legend>
      <label><input type="checkbox" id="timed" checked> 90초 제한</label>
      <label><input type="checkbox" id="mouse"> 마우스 방향 이동</label>
      <label><input type="checkbox" id="show-touch"> 화면 이동·행동 버튼 항상 표시</label>
      <label><input type="checkbox" id="debug"> 지면 판정 보기</label>
    </fieldset></div><div class="dialog-actions"><button id="poster-zoom" hidden aria-pressed="false">크게 보기</button><button id="dialog-close">닫기</button></div>
  </dialog>
  <p class="sr-only" id="announcement" role="status" aria-live="polite"></p>
  <img id="grass-reference" hidden src="assets/environment/edible-grass-v011.png" alt="풀 관찰 그림">
  <img id="research-reference" hidden src="assets/ui/research-v012.png" alt="연못 탐험 연구소">
  <script type="module" src="src/main.js"></script>
</body>
</html>
